
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小智音乐控制</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: rgba(15, 23, 42, 0.78);
            --panel-border: rgba(148, 163, 184, 0.16);
            --text: #e5eefb;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --accent-2: #22c55e;
            --danger: #fb7185;
            --shadow: 0 30px 80px rgba(2, 6, 23, 0.45);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(56, 189, 248, 0.24), transparent 30%),
                radial-gradient(circle at bottom right, rgba(34, 197, 94, 0.16), transparent 28%),
                linear-gradient(160deg, #020617, #0f172a 45%, #111827);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .shell {
            width: 100%;
            max-width: 980px;
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 20px;
        }
        .card {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(18px);
        }
        .player {
            padding: 28px;
            position: relative;
            overflow: hidden;
        }
        .player::before {
            content: "";
            position: absolute;
            inset: -30% auto auto -20%;
            width: 280px;
            height: 280px;
            border-radius: 999px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.25), transparent 65%);
        }
        .topbar, .actions, .volume-row, .search-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(56, 189, 248, 0.14);
            color: #bfe9ff;
            font-size: 13px;
        }
        .cover {
            width: 220px;
            aspect-ratio: 1;
            margin: 24px auto;
            border-radius: 28px;
            background:
                linear-gradient(135deg, rgba(56, 189, 248, 0.32), rgba(34, 197, 94, 0.18)),
                linear-gradient(45deg, #1e293b, #0f172a);
            border: 1px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 88px;
            color: #f8fafc;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 18px 45px rgba(0,0,0,0.28);
        }
        .cover.has-image {
            color: transparent;
        }
        h1 {
            margin: 0;
            font-size: 28px;
            line-height: 1.15;
        }
        .artist {
            color: var(--muted);
            margin-top: 8px;
            font-size: 16px;
        }
        .status {
            margin-top: 14px;
            color: #d7f7ff;
            font-size: 14px;
        }
        .progress {
            margin-top: 24px;
        }
        .time-row {
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--muted);
        }
        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
        }
        .actions {
            margin-top: 22px;
            justify-content: center;
        }
        button {
            border: none;
            border-radius: 16px;
            padding: 12px 18px;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.16s ease, opacity 0.16s ease, background 0.16s ease;
        }
        button:hover { transform: translateY(-1px); }
        button.primary {
            background: linear-gradient(135deg, var(--accent), #0ea5e9);
            color: white;
            min-width: 120px;
        }
        button.secondary {
            background: rgba(148, 163, 184, 0.14);
            color: var(--text);
        }
        button.danger {
            background: rgba(251, 113, 133, 0.14);
            color: #ffd6dd;
        }
        .side {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .panel-title {
            margin: 0 0 14px;
            font-size: 18px;
        }
        .search-box, .volume-card, .tips {
            padding: 18px;
            border-radius: 18px;
            background: rgba(15, 23, 42, 0.72);
            border: 1px solid rgba(148, 163, 184, 0.12);
        }
        .search-input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(148, 163, 184, 0.18);
            background: rgba(15, 23, 42, 0.9);
            color: var(--text);
            font-size: 15px;
        }
        .search-actions {
            margin-top: 12px;
        }
        .search-actions button {
            flex: 1;
        }
        .hint, .message {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.6;
        }
        .message {
            min-height: 20px;
            margin-top: 12px;
        }
        .volume-value {
            min-width: 48px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        a { color: #bfe9ff; text-decoration: none; }
        @media (max-width: 860px) {
            .shell {
                grid-template-columns: 1fr;
            }
            .cover {
                width: 180px;
                font-size: 72px;
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <section class="card player">
            <div class="topbar">
                <span class="badge" id="playingBadge">音乐播放器</span>
                <a href="/">返回遥控器</a>
            </div>
            <div class="cover" id="coverArt">♪</div>
            <h1 id="trackTitle">当前没有播放歌曲</h1>
            <div class="artist" id="trackArtist">等待播放</div>
            <div class="status" id="statusText">你可以搜索歌曲，也可以随机播放。</div>
            <div class="progress">
                <input type="range" id="progressBar" min="0" max="100" value="0" disabled>
                <div class="time-row">
                    <span id="elapsedText">00:00</span>
                    <span id="durationText">00:00</span>
                </div>
            </div>
            <div class="actions">
                <button class="secondary" id="randomBtn">随机播放</button>
                <button class="primary" id="nextBtn">下一首</button>
                <button class="danger" id="stopBtn">停止</button>
            </div>
        </section>

        <aside class="card side">
            <div class="search-box">
                <h2 class="panel-title">搜索歌曲</h2>
                <input class="search-input" id="searchInput" type="text" placeholder="例如：稻香 周杰伦">
                <div class="search-actions">
                    <button class="primary" id="searchBtn">播放搜索结果</button>
                </div>
                <div class="message" id="actionMessage"></div>
            </div>

            <div class="volume-card">
                <h2 class="panel-title">音量调节</h2>
                <div class="volume-row">
                    <input type="range" id="volumeSlider" min="0" max="100" value="0">
                    <span class="volume-value" id="volumeValue">0%</span>
                </div>
                <div class="hint">这里调节的是设备统一输出音量，音乐播放和语音对话都会一起变化。</div>
            </div>

            <div class="tips">
                <h2 class="panel-title">使用提示</h2>
                <div class="hint">
                    搜索框留空时点击“随机播放”，会直接随机播一首。<br>
                    当前页面会自动轮询设备状态，显示正在播放的歌曲、歌手和进度。
                </div>
            </div>
        </aside>
    </div>

    <script>
        const els = {
            title: document.getElementById('trackTitle'),
            artist: document.getElementById('trackArtist'),
            status: document.getElementById('statusText'),
            badge: document.getElementById('playingBadge'),
            cover: document.getElementById('coverArt'),
            progress: document.getElementById('progressBar'),
            elapsed: document.getElementById('elapsedText'),
            duration: document.getElementById('durationText'),
            searchInput: document.getElementById('searchInput'),
            actionMessage: document.getElementById('actionMessage'),
            volumeSlider: document.getElementById('volumeSlider'),
            volumeValue: document.getElementById('volumeValue'),
        };

        let volumeUpdateTimer = null;

        function formatTime(ms) {
            if (!ms || ms < 0) return '00:00';
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
        }

        function setMessage(text, isError = false) {
            els.actionMessage.textContent = text || '';
            els.actionMessage.style.color = isError ? '#fecaca' : '#94a3b8';
        }

        async function fetchStatus() {
            try {
                const resp = await fetch('/api/music/status');
                const data = await resp.json();
                els.title.textContent = data.playing ? (data.title || '未知歌曲') : '当前没有播放歌曲';
                els.artist.textContent = data.playing ? (data.artist || '未知歌手') : '等待播放';
                els.status.textContent = data.playing ? '正在播放中' : '你可以搜索歌曲，也可以随机播放。';
                els.badge.textContent = data.playing ? '正在播放' : '待机中';
                if (data.playing && data.cover_url) {
                    els.cover.style.backgroundImage = 'url("' + data.cover_url.replace(/"/g, '\\"') + '")';
                    els.cover.textContent = '';
                    els.cover.classList.add('has-image');
                } else {
                    els.cover.style.backgroundImage = '';
                    els.cover.textContent = '♪';
                    els.cover.classList.remove('has-image');
                }
                els.progress.max = Math.max(data.total_duration_ms || 0, 1);
                els.progress.value = Math.min(data.elapsed_ms || 0, els.progress.max);
                els.elapsed.textContent = formatTime(data.elapsed_ms);
                els.duration.textContent = formatTime(data.total_duration_ms);
                els.volumeSlider.value = data.volume;
                els.volumeValue.textContent = data.volume + '%';
            } catch (err) {
                console.error(err);
            }
        }

        async function postJson(url, body) {
            const resp = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body || {})
            });
            return resp.json();
        }

        document.getElementById('searchBtn').addEventListener('click', async () => {
            const query = els.searchInput.value.trim();
            setMessage(query ? '正在搜索并播放...' : '搜索词为空，将随机播放...');
            try {
                const result = await postJson('/api/music/play', { query });
                setMessage(result.message || '已提交播放请求');
                await fetchStatus();
            } catch (err) {
                console.error(err);
                setMessage('播放请求失败', true);
            }
        });

        document.getElementById('randomBtn').addEventListener('click', async () => {
            setMessage('正在随机播放...');
            try {
                const result = await postJson('/api/music/play', { query: '' });
                setMessage(result.message || '已提交随机播放请求');
                await fetchStatus();
            } catch (err) {
                console.error(err);
                setMessage('随机播放失败', true);
            }
        });

        document.getElementById('nextBtn').addEventListener('click', async () => {
            setMessage('正在切换下一首...');
            try {
                const result = await postJson('/api/music/next');
                setMessage(result.message || '已切换下一首');
                await fetchStatus();
            } catch (err) {
                console.error(err);
                setMessage('切换下一首失败', true);
            }
        });

        document.getElementById('stopBtn').addEventListener('click', async () => {
            setMessage('正在停止播放...');
            try {
                const result = await postJson('/api/music/stop');
                setMessage(result.message || '已停止播放');
                await fetchStatus();
            } catch (err) {
                console.error(err);
                setMessage('停止播放失败', true);
            }
        });

        els.volumeSlider.addEventListener('input', () => {
            const value = Number(els.volumeSlider.value || 0);
            els.volumeValue.textContent = value + '%';
            if (volumeUpdateTimer) {
                clearTimeout(volumeUpdateTimer);
            }
            volumeUpdateTimer = setTimeout(async () => {
                try {
                    await postJson('/api/audio/volume', { volume: value });
                    setMessage('音量已调整到 ' + value + '%');
                } catch (err) {
                    console.error(err);
                    setMessage('音量调整失败', true);
                }
            }, 120);
        });

        fetchStatus();
        setInterval(fetchStatus, 1500);
    </script>
</body>
</html>
